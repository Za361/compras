<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Lista de Compras</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lista de compras bilingue (PT/EN), funciona offline.">
<meta name="theme-color" content="#1f7a4d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2420;--mu:#6b756e;--ac:#1f7a4d;--acx:#fff;--bd:#e2e0d9;--wa:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121613;--card:#1b211d;--tx:#eef1ee;--mu:#8f9a92;--ac:#4cc58a;--acx:#0b1a11;--bd:#2b332d;--wa:#ff7b6b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.hd{display:flex;align-items:center;gap:8px}
h1{font-size:20px;margin:6px 0 10px;flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.row{display:flex;gap:6px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 10px}
.ghost.warn{border-color:var(--wa);color:var(--wa);font-weight:600}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px 0;overflow:hidden}
.sec h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0;padding:10px 12px;color:var(--mu);display:flex;justify-content:space-between}
.secf{border-color:var(--ac)}
.secf .fb{padding:0 12px 12px}
.secf label:first-child{margin-top:0}
.hint{display:block;color:var(--mu);font-size:13px;margin-top:8px}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--bd)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;flex:none;color:var(--acx);font-size:16px;line-height:1}
.it.done .chk{background:var(--ac)}
.it.done .nm{text-decoration:line-through;color:var(--mu)}
.nm{flex:1;min-width:0}
.nm b{font-weight:600}.nm small{display:block;color:var(--mu)}
.pr{text-align:right;font-size:14px;color:var(--mu);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;font-size:14px}
.bar b{font-size:17px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.mic.rec{background:var(--wa);color:#fff;border-color:var(--wa);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
#toast{position:fixed;left:12px;right:12px;bottom:70px;max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;z-index:9;font-size:14px;display:none}
#inst{display:none;font-size:13px;padding:6px 10px}
#shr{display:none;font-size:13px;padding:6px 10px;white-space:nowrap}
#sy{font-size:12px;vertical-align:middle;color:var(--mu)}
#sy.on{color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
<div class="hd"><h1>🛒 Lista de Compras · Shopping List <span id="sy" title="Sincronização · Sync">○</span></h1><button class="ghost" id="inst">⤓ Instalar</button><button class="ghost" id="shr" onclick="shareList()">👥 Partilhar</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<div class="bar"><span>🧺 <b id="tc">0,00 €</b> <span id="tcl"></span></span><span>Total <b id="tt">0,00 €</b></span></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg"></dialog>

<script>
const DICT=`maçã=apple=fv;pera=pear=fv;banana=banana=fv;laranja=orange=fv;tangerina=tangerine=fv;limão=lemon=fv;lima=lime=fv;ananás=pineapple=fv;manga=mango=fv;kiwi=kiwi=fv;melão=melon=fv;melancia=watermelon=fv;uvas=grapes=fv;morangos=strawberries=fv;mirtilos=blueberries=fv;framboesas=raspberries=fv;pêssego=peach=fv;ameixa=plum=fv;cerejas=cherries=fv;abacate=avocado=fv;tomate=tomato=fv;tomate cherry=cherry tomatoes=fv;cebola=onion=fv;alho=garlic=fv;batata=potato=fv;batata doce=sweet potato=fv;cenoura=carrot=fv;alface=lettuce=fv;rúcula=rocket=fv;salada=salad=fv;espinafres=spinach=fv;couve=cabbage=fv;brócolos=broccoli=fv;couve-flor=cauliflower=fv;pimento=bell pepper=fv;pepino=cucumber=fv;courgette=zucchini=fv;beringela=aubergine=fv;cogumelos=mushrooms=fv;abóbora=pumpkin=fv;alho francês=leek=fv;feijão verde=green beans=fv;salsa=parsley=fv;coentros=coriander=fv;hortelã=mint=fv;gengibre=ginger=fv;fruta=fruit=fv;legumes=vegetables=fv;pão=bread=pad;pão de forma=sliced bread=pad;pão integral=wholemeal bread=pad;broa=corn bread=pad;carcaças=bread rolls=pad;baguete=baguette=pad;croissant=croissant=pad;bolo=cake=pad;bolos=pastries=pad;pastel de nata=custard tart=pad;tostas=toasts=pad;frango=chicken=talho;peito de frango=chicken breast=talho;coxas de frango=chicken thighs=talho;peru=turkey=talho;carne picada=minced meat=talho;carne=meat=talho;bife=steak=talho;vaca=beef=talho;porco=pork=talho;costeletas=chops=talho;entrecosto=ribs=talho;lombo=pork loin=talho;salsichas=sausages=talho;hambúrguer=burger=talho;borrego=lamb=talho;peixe=fish=peix;salmão=salmon=peix;bacalhau=salted cod=peix;camarão=shrimp=peix;gambas=prawns=peix;atum fresco=fresh tuna=peix;pescada=hake=peix;dourada=sea bream=peix;robalo=sea bass=peix;sardinhas=sardines=peix;carapau=horse mackerel=peix;polvo=octopus=peix;lulas=squid=peix;choco=cuttlefish=peix;mexilhão=mussels=peix;amêijoas=clams=peix;fiambre=sliced ham=char;queijo=cheese=char;queijo flamengo=edam cheese=char;queijo ralado=grated cheese=char;mozzarella=mozzarella=char;presunto=cured ham=char;chouriço=chorizo=char;mortadela=mortadella=char;salame=salami=char;peito de peru=sliced turkey=char;bacon=bacon=char;paio=cured pork loin=char;leite=milk=lat;leite magro=skimmed milk=lat;leite meio gordo=semi-skimmed milk=lat;bebida vegetal=plant milk=lat;leite de aveia=oat milk=lat;iogurte=yogurt=lat;iogurte grego=greek yogurt=lat;manteiga=butter=lat;margarina=margarine=lat;ovos=eggs=lat;natas=cream=lat;queijo fresco=fresh cheese=lat;requeijão=ricotta=lat;kefir=kefir=lat;sobremesa=dessert=lat;gelado=ice cream=cong;gelados=ice creams=cong;pizza congelada=frozen pizza=cong;pizza=pizza=cong;ervilhas=peas=cong;douradinhos=fish fingers=cong;lasanha=lasagne=cong;arroz=rice=merc;massa=pasta=merc;esparguete=spaghetti=merc;azeite=olive oil=merc;óleo=oil=merc;vinagre=vinegar=merc;açúcar=sugar=merc;farinha=flour=merc;fermento=baking powder=merc;café=coffee=merc;cápsulas=coffee capsules=merc;chá=tea=merc;cereais=cereal=merc;aveia=oats=merc;bolachas=biscuits=merc;sal=salt=merc;pimenta=pepper=merc;especiarias=spices=merc;caldo=stock cubes=merc;feijão=beans=merc;grão=chickpeas=merc;lentilhas=lentils=merc;atum=tuna=merc;sardinhas em lata=tinned sardines=merc;polpa de tomate=tomato puree=merc;ketchup=ketchup=merc;maionese=mayonnaise=merc;mostarda=mustard=merc;azeitonas=olives=merc;compota=jam=merc;mel=honey=merc;chocolate=chocolate=merc;cacau=cocoa=merc;batatas fritas=crisps=merc;frutos secos=nuts=merc;amendoins=peanuts=merc;nozes=walnuts=merc;amêndoas=almonds=merc;pão ralado=breadcrumbs=merc;sopa=soup=merc;água=water=beb;sumo de laranja=orange juice=beb;sumo de maçã=apple juice=beb;asas de frango=chicken wings=talho;leite com chocolate=chocolate milk=lat;água com gás=sparkling water=beb;sumo=juice=beb;vinho=wine=beb;vinho tinto=red wine=beb;vinho branco=white wine=beb;espumante=sparkling wine=beb;cerveja=beer=beb;refrigerante=soda=beb;coca-cola=coke=beb;ice tea=iced tea=beb;detergente=detergent=lim;detergente da loiça=dish soap=lim;detergente da roupa=laundry detergent=lim;amaciador=fabric softener=lim;lixívia=bleach=lim;desinfetante=disinfectant=lim;limpa vidros=glass cleaner=lim;esponjas=sponges=lim;pastilhas da máquina=dishwasher tablets=lim;papel de cozinha=paper towels=lim;rolo de cozinha=kitchen roll=lim;guardanapos=napkins=lim;sacos do lixo=bin bags=lim;sacos=bags=lim;papel de alumínio=foil=lim;película aderente=cling film=lim;papel higiénico=toilet paper=hig;champô=shampoo=hig;condicionador=conditioner=hig;amaciador de cabelo=hair conditioner=hig;gel de banho=shower gel=hig;sabonete=soap=hig;pasta de dentes=toothpaste=hig;escova de dentes=toothbrush=hig;fio dental=dental floss=hig;elixir=mouthwash=hig;desodorizante=deodorant=hig;lâminas=razors=hig;espuma de barbear=shaving foam=hig;creme hidratante=moisturiser=hig;protetor solar=sunscreen=hig;pensos=plasters=hig;pensos higiénicos=sanitary pads=hig;tampões=tampons=hig;fraldas=nappies=hig;toalhitas=wipes=hig;cotonetes=cotton buds=hig;algodão=cotton wool=hig;lenços=tissues=hig`.split(';').map(s=>{const[p,e,c]=s.split('=');return{pt:p,en:e,sec:c}});
const DEF=[['fv','Frutas e Legumes','Fruit & Veg'],['pad','Padaria','Bakery'],['talho','Talho','Butcher'],['peix','Peixaria','Fish'],['char','Charcutaria e Queijos','Deli & Cheese'],['lat','Laticínios','Dairy'],['cong','Congelados','Frozen'],['merc','Mercearia','Grocery'],['beb','Bebidas','Drinks'],['lim','Limpeza','Cleaning'],['hig','Higiene','Hygiene']];
let S;try{S=JSON.parse(localStorage.getItem('pd')||'null')}catch(e){}
if(!S)S={sections:DEF.map(d=>({id:d[0],pt:d[1],en:d[2]})),items:[],usual:[]};
S.items.forEach((i,k)=>{if(!i.t)i.t=Date.now()+k});
if(!S.learn)S.learn={};   // name → aisle, learned when you move an item to another aisle
let tab='list',secEdit=null,rec=null;
const save=()=>{try{localStorage.setItem('pd',JSON.stringify(S))}catch(e){}};
// Remote sync hooks: no-ops until the Firebase module below connects (app still works fully offline/local).
const R={item(){},del(){},field(){}};
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const secName=s=>s.pt+(s.en?' · '+s.en:'');

function find(t){const n=norm(t);if(!n)return null;
  const hit=v=>S.usual.find(x=>norm(x.pt)===v||norm(x.en)===v)||DICT.find(x=>norm(x.pt)===v||norm(x.en)===v);
  let r=hit(n);if(r)return r;
  // singular/plural fallback: "laranjas"→laranja, "limões"→limão, "uva"→uvas
  for(const v of[n.replace(/oes$/,'ao'),n.replace(/aes$/,'ao'),n.replace(/es$/,''),n.replace(/s$/,''),n+'s'])if(v!==n&&(r=hit(v)))return r;
  return null}
/* ---------- Automatic aisle ---------- */
// "um pacote de leite" → name "leite", unit "pacote"
const ART=/^(?:o|a|os|as|um|uma|uns|umas|the|some)\s+/i;
const UNIT=/^(?:(?:meia\s+)?d[uú]zias?|pacotes?|garrafas?|latas?|embalage(?:m|ns)|caixas?|sacos?|frascos?|quilos?|kg|kilos?|litros?|gramas?|molhos?|cachos?|unidades?|packs?|bottles?|cans?|bags?|boxes?|jars?)\s+(?:de|do|da|dos|das|of)\s+/i;
function core(t){let s=t.trim().replace(/[.!?]+$/,'').replace(ART,''),unit='';const m=s.match(UNIT);
  if(m){unit=m[0].replace(/\s+(?:de|do|da|dos|das|of)\s+$/i,'').trim();s=s.slice(m[0].length).replace(ART,'')}return{name:s.trim(),unit}}
// every dictionary name (PT and EN) as a whole-word pattern, longest first, to find "iogurte" in "iogurte natural"
let IDX=null;
const sing=n=>n.split(' ').map(w=>w.replace(/oes$/,'ao').replace(/aes$/,'ao')).join(' ');
function idx(){if(IDX)return IDX;IDX=[];
  DICT.forEach(d=>[[d.pt,1],[d.en,0]].forEach(([w,pt])=>{const n=norm(w);if(!n)return;
    const p=n.split(' ').map(x=>x.replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')+'(?:s|es)?').join('\\s+');
    IDX.push({pt,re:new RegExp('(?:^|\\s)'+p+'(?=\\s|$)'),sec:d.sec})}));
  return IDX}
// The main word decides the aisle: first in Portuguese ("sumo de laranja" → drinks),
// last in English ("orange juice" → drinks). Longer names win at the same spot ("pão de forma" over "pão").
function guessSec(t){const n=' '+sing(norm(t).replace(/[^\p{L}\p{N}\s-]/gu,' ').replace(/\s+/g,' ').trim());
  if(/\s(?:congelad[oa]s?|frozen)(?=\s|$)/.test(n))return'cong';
  const hits=[];idx().forEach(x=>{const m=x.re.exec(n);if(m)hits.push({pt:x.pt,sec:x.sec,s:m.index,e:m.index+m[0].length})});
  if(!hits.length)return null;
  const pt=hits.filter(h=>h.pt);
  const best=pt.length?pt.sort((a,b)=>a.s-b.s||b.e-a.e)[0]:hits.sort((a,b)=>b.e-a.e||a.s-b.s)[0];
  return best.sec}
function otherSec(){let s=S.sections.find(x=>x.id==='outros');
  if(!s){s={id:'outros',pt:'Outros',en:'Other'};S.sections.push(s);R.field('sections')}return s.id}
function autoSec(pt,f){const ok=id=>id&&S.sections.some(s=>s.id===id)?id:null;
  return ok(S.learn[norm(pt)])||ok(f&&f.sec)||ok(guessSec(pt))||otherSec()}

function addItem(text,secId,qty=1){
  text=text.trim();if(!text)return;
  const{name,unit}=core(text);if(!name)return;
  const f=find(name);
  const pt=f?f.pt:name.charAt(0).toUpperCase()+name.slice(1);
  const ex=S.items.find(i=>!i.done&&norm(i.pt)===norm(pt));
  if(ex){ex.qty+=qty;save();render();R.item(ex);return}
  const sec=secId&&secId!=='auto'?secId:autoSec(pt,f);
  const it={id:uid(),sec,pt,en:f?f.en:'',qty,price:f&&f.price?f.price:0,note:unit,done:false,t:Date.now()};
  S.items.push(it);save();render();R.item(it)}

function render(remote){
  // keep whatever is being typed when a remote update re-renders the screen
  const keep=remote?['ni','ns','sp','se'].map(k=>{const e=$(k);return e&&[k,e.value]}).filter(Boolean):[],fo=remote&&document.activeElement&&document.activeElement.id;
  $('tabs').innerHTML=[['list','Lista · List'],['usual','Habituais · Usual'],['sec','Secções · Aisles']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';secEdit=null;render()">${t[1]}</button>`).join('');
  $('view').innerHTML=tab==='list'?vList():tab==='usual'?vUsual():vSec();
  const tot=S.items.reduce((a,i)=>a+i.qty*i.price,0),cart=S.items.filter(i=>i.done).reduce((a,i)=>a+i.qty*i.price,0);
  $('tt').textContent=eur(tot);$('tc').textContent=eur(cart);$('tcl').textContent=S.items.filter(i=>i.done).length+'/'+S.items.length;
  keep.forEach(([k,v])=>{const e=$(k);if(e)e.value=v});
  if(remote){if(fo&&$(fo))$(fo).focus()}
  else if(tab==='sec'&&secEdit!==null){const f=$('sp');if(f){f.focus();f.closest('form').scrollIntoView({block:'nearest'})}}
}
function vList(){
  const opts=S.sections.map(s=>`<option value="${s.id}">${esc(secName(s))}</option>`).join('');
  const dl=[...S.usual,...DICT].map(x=>`<option value="${esc(x.pt)}">${esc(x.en)}</option>`).join('');
  let h=`<div class="row"><input id="ni" list="dl" placeholder="Adicionar · Add item…" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key==='Enter')go()"><button class="ghost mic ${rec?'rec':''}" id="mic" aria-label="Ditar · Dictate" onclick="voice()">🎤</button><button class="btn" aria-label="Adicionar · Add" onclick="go()">+</button></div>
  <datalist id="dl">${dl}</datalist>
  <select id="ns" style="margin-top:6px"><option value="auto">Secção automática · Auto aisle</option>${opts}</select>`;
  if(!S.items.length)h+=`<div class="empty">Lista vazia · Empty list<br><small>Escreva, fale ou use os Habituais.</small></div>`;
  S.sections.forEach(s=>{
    const its=S.items.filter(i=>i.sec===s.id).sort((a,b)=>a.done-b.done);
    if(!its.length)return;
    h+=`<div class="sec"><h2><span>${esc(secName(s))}</span><span>${its.filter(i=>i.done).length}/${its.length}</span></h2>`+its.map(i=>`<div class="it ${i.done?'done':''}"><button class="chk" onclick="tog('${i.id}')">${i.done?'✓':''}</button><div class="nm" onclick="edit('${i.id}')"><b>${i.qty>1?i.qty+'× ':''}${esc(i.pt)}</b>${i.en?`<small>${esc(i.en)}</small>`:''}${i.note?`<small>📝 ${esc(i.note)}</small>`:''}</div><div class="pr">${i.price?eur(i.qty*i.price):''}</div></div>`).join('')+`</div>`;
  });
  if(S.items.some(i=>i.done))h+=`<button class="ghost" style="width:100%" onclick="clearDone()">Limpar comprados · Clear bought</button>`;
  return h}
function vUsual(){
  if(!S.usual.length)return`<div class="empty">Ainda sem habituais.<br>Abra um item na lista e escolha ★.<br><small>No usual items yet. Open an item and tap ★.</small></div>`;
  return S.usual.map((u,i)=>`<div class="sec"><div class="it" style="border:0"><div class="nm"><b>${esc(u.pt)}</b>${u.en?`<small>${esc(u.en)}</small>`:''}</div><div class="pr">${u.price?eur(u.price):''}</div><button class="btn" onclick="addU(${i})">+</button><button class="ghost" onclick="S.usual.splice(${i},1);save();render();R.field('usual')">✕</button></div></div>`).join('')}

/* ---------- Aisles: in-page forms instead of prompt() ---------- */
function vSec(){
  return`<p style="color:var(--mu);margin-top:0">Ordene pela sua rota na loja. · Order by your walking route.</p>`+
  S.sections.map((s,i)=>secEdit===i?secForm(i,s):`<div class="sec"><div class="it" style="border:0"><div class="nm"><b>${i+1}. ${esc(s.pt)}</b><small>${esc(s.en)}</small></div><button class="ghost" aria-label="Subir · Up" onclick="mv(${i},-1)">▲</button><button class="ghost" aria-label="Descer · Down" onclick="mv(${i},1)">▼</button><button class="ghost" aria-label="Editar · Edit" onclick="secEdit=${i};render()">✎</button></div></div>`).join('')+
  (secEdit==='new'?secForm('new',{pt:'',en:''}):`<button class="btn" style="width:100%" onclick="secEdit='new';render()">+ Nova secção · New aisle</button>`)}
function secForm(i,s){
  const isNew=i==='new',k=isNew?"'new'":i;
  const cnt=isNew?0:S.items.filter(x=>x.sec===s.id).length;
  const canDel=!isNew&&S.sections.length>1;
  return`<form class="sec secf" onsubmit="saveSec(event,${k})" autocomplete="off">
  <h2>${isNew?'Nova secção · New aisle':'Editar secção · Edit aisle'}</h2>
  <div class="fb"><label for="sp">Nome (PT)</label><input id="sp" name="pt" required maxlength="40" value="${esc(s.pt)}" placeholder="ex.: Bio e Dietéticos">
  <label for="se">Name (EN) · opcional</label><input id="se" name="en" maxlength="40" value="${esc(s.en)}" placeholder="e.g. Organic">
  <div class="row" style="margin-top:12px">${canDel?`<button type="button" class="ghost" aria-label="Apagar · Delete" onclick="delSec(${i},this)">🗑</button>`:''}<button type="button" class="ghost" onclick="secEdit=null;render()">Cancelar · Cancel</button><button class="btn" style="flex:1">Guardar · Save</button></div>
  ${cnt&&canDel?`<small class="hint">Se apagar, ${cnt} ${cnt>1?'itens passam':'item passa'} para «${esc(S.sections[i===0?1:0].pt)}». · Deleting moves ${cnt} item(s) to that aisle.</small>`:''}</div></form>`}
function saveSec(e,i){
  e.preventDefault();const f=e.target.elements;
  const pt=f.pt.value.trim(),en=f.en.value.trim();if(!pt){f.pt.focus();return}
  if(i==='new')S.sections.push({id:uid(),pt,en});else Object.assign(S.sections[i],{pt,en});
  secEdit=null;save();render();R.field('sections')}
function delSec(i,b){
  if(!b.dataset.c){b.dataset.c=1;b.textContent='Apagar? · Delete?';b.classList.add('warn');return}
  const s=S.sections[i],to=S.sections[i===0?1:0].id;
  const moved=S.items.filter(x=>x.sec===s.id);moved.forEach(x=>x.sec=to);S.usual.forEach(x=>{if(x.sec===s.id)x.sec=to});
  S.sections.splice(i,1);secEdit=null;save();render();
  R.field('sections');R.field('usual');moved.forEach(x=>R.item(x))}
function mv(i,d){const j=i+d;if(j<0||j>=S.sections.length)return;[S.sections[i],S.sections[j]]=[S.sections[j],S.sections[i]];save();render();R.field('sections')}

function go(){const i=$('ni');addItem(i.value,$('ns').value);const n=$('ni');n.value='';n.focus()}
function tog(id){const i=S.items.find(x=>x.id===id);if(!i)return;i.done=!i.done;save();render();R.item(i)}
function clearDone(){const ids=S.items.filter(i=>i.done).map(i=>i.id);S.items=S.items.filter(i=>!i.done);save();render();R.del(ids)}
function addU(i){const u=S.usual[i];const it={id:uid(),sec:S.sections.some(s=>s.id===u.sec)?u.sec:S.sections[0].id,pt:u.pt,en:u.en||'',qty:1,price:u.price||0,note:'',done:false,t:Date.now()};S.items.push(it);save();render();R.item(it);say('+ '+u.pt)}

function edit(id){
  const i=S.items.find(x=>x.id===id),d=$('dlg');
  const isU=S.usual.some(u=>norm(u.pt)===norm(i.pt));
  d.innerHTML=`<label>Português</label><input id="e1" value="${esc(i.pt)}"><label>English</label><input id="e2" value="${esc(i.en)}">
  <div class="row"><div><label>Qtd · Qty</label><input id="e3" type="number" inputmode="numeric" min="1" step="1" value="${i.qty}"></div><div><label>Preço · Price (€)</label><input id="e4" type="number" inputmode="decimal" min="0" step="0.01" value="${i.price||''}"></div></div>
  <label>Secção · Aisle</label><select id="e5">${S.sections.map(s=>`<option value="${s.id}" ${s.id===i.sec?'selected':''}>${esc(secName(s))}</option>`).join('')}</select>
  <label>Nota · Note</label><input id="e6" value="${esc(i.note)}">
  <div class="row" style="margin-top:14px"><button class="ghost" onclick="del('${id}')">🗑</button><button class="ghost" id="st">${isU?'★':'☆'}</button><button class="btn" style="flex:1" onclick="ok('${id}')">OK</button></div>`;
  d.dataset.u=isU?1:0;$('st').onclick=()=>{d.dataset.u=d.dataset.u==='1'?0:1;$('st').textContent=d.dataset.u==='1'?'★':'☆'};
  d.showModal()}
function ok(id){
  const i=S.items.find(x=>x.id===id),d=$('dlg');
  if(!i){d.close();say('Este item foi apagado no outro telemóvel. · This item was deleted on the other phone.');return}
  const u0=JSON.stringify(S.usual),sec0=i.sec;
  i.pt=$('e1').value.trim()||i.pt;i.en=$('e2').value.trim();i.qty=Math.max(1,parseInt($('e3').value)||1);i.price=parseFloat(String($('e4').value).replace(',','.'))||0;i.sec=$('e5').value;i.note=$('e6').value.trim();
  const k=S.usual.findIndex(u=>norm(u.pt)===norm(i.pt));
  if(d.dataset.u==='1'){const u={pt:i.pt,en:i.en,sec:i.sec,price:i.price};k>=0?S.usual[k]=u:S.usual.push(u)}else if(k>=0)S.usual.splice(k,1);
  // moved to another aisle → remember it, so next time this item goes straight there (on both phones)
  const learnt=i.sec!==sec0;if(learnt)S.learn[norm(i.pt)]=i.sec;
  save();d.close();render();R.item(i);if(JSON.stringify(S.usual)!==u0)R.field('usual');if(learnt)R.field('learn')}
function del(id){S.items=S.items.filter(x=>x.id!==id);save();$('dlg').close();render();R.del([id])}

function say(m,ms=6000){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}

/* ---------- Voice (pt-PT), tuned for Chrome on Android ---------- */
const NUM={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,doze:12};
// "leite ovos pão de forma" (Android rarely adds commas) → ["leite","ovos","pão de forma"],
// but only when every word is a known item; otherwise keep the phrase whole.
function greedy(w){if(w.length<2)return null;const r=[];let i=0;
  while(i<w.length){let j=w.length;for(;j>i;j--)if(find(w.slice(i,j).join(' ')))break;if(j===i)return null;r.push(w.slice(i,j).join(' '));i=j}
  return r.length>1?r:null}
function parseSpoken(t){const out=[];
  t.split(/\s*[,;]\s*|\s+(?:e|mais|and)\s+/i).forEach(ch=>{
    ch=ch.trim().replace(/[.!?]+$/,'');if(!ch)return;
    const w=ch.split(/\s+/);let q=1;const n=norm(w[0]);
    if(w.length>1&&/^\d{1,2}$/.test(n)){q=+n;w.shift()}else if(w.length>1&&NUM[n]){q=NUM[n];w.shift()}
    const g=greedy(w);if(g)g.forEach((p,k)=>out.push([p,k?1:q]));else out.push([w.join(' '),q]);
  });return out}
function setMic(on){const b=$('mic');if(b)b.classList.toggle('rec',on)}
async function askMic(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());
    say('Microfone autorizado ✓ Toque 🎤 outra vez. · Mic allowed, tap 🎤 again.')}
  catch(e){say('Microfone bloqueado. No Chrome: ⋮ → Definições → Definições de sites → Microfone → permitir este site. · Mic blocked: allow it in Chrome site settings.',12000)}}
function voice(lang='pt-PT'){
  if(rec){rec.stop();return}                       // second tap = stop
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){say('Voz não suportada neste navegador. Use o 🎤 do teclado. · Voice not supported here; use the keyboard 🎤.');return}
  if(!window.isSecureContext){say('A voz só funciona com https://. Abra a app pelo link publicado. · Voice needs https.');return}
  const r=new R();rec=r;let got=false,err=null;
  r.lang=lang;r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
  r.onstart=()=>{setMic(true);say('A ouvir… diga os itens · Listening… say the items',15000)};
  r.onresult=e=>{
    for(let k=e.resultIndex;k<e.results.length;k++){const res=e.results[k];if(!res.isFinal)continue;
      const t=res[0].transcript.trim();if(!t)continue;got=true;
      const items=parseSpoken(t);items.forEach(([x,q])=>addItem(x,'auto',q));
      say('Ouvi · Heard: «'+t+'» → '+items.map(([x,q])=>(q>1?q+'× ':'')+x).join(', '))}};
  r.onerror=e=>{err=e.error;
    if(e.error==='language-not-supported'&&lang==='pt-PT'){rec=null;setTimeout(()=>voice('pt'),0);return}
    if(e.error==='not-allowed'){askMic();return}
    const m={'no-speech':'Não ouvi nada, toque 🎤 e fale logo. · Didn’t hear anything, try again.',
      'aborted':'',
      'audio-capture':'Microfone ocupado ou indisponível (feche outras apps que o usem). · Mic busy or unavailable.',
      'network':'A voz precisa de internet. Sem rede, use o teclado. · Voice needs internet.',
      'service-not-allowed':'Serviço de voz indisponível. Verifique que a app Google está ativa (Definições → Aplicações → Google). · Speech service unavailable; enable the Google app.'};
    const msg=e.error in m?m[e.error]:'Erro de voz · Voice error: '+e.error;if(msg)say(msg,9000)};
  r.onend=()=>{if(rec===r)rec=null;setMic(false);if(!got&&!err)say('Não ouvi nada, tente de novo. · Didn’t catch that, try again.')};
  try{r.start()}catch(e){rec=null;setMic(false);say('Erro · Error: '+e.message)}}

/* ---------- PWA: offline + install ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
let instEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('inst').style.display='block'});
$('inst').onclick=async()=>{if(!instEv)return;instEv.prompt();await instEv.userChoice.catch(()=>{});instEv=null;$('inst').style.display='none'};
addEventListener('appinstalled',()=>{$('inst').style.display='none';say('Instalada ✓ · Installed')});

/* ---------- Sharing ---------- */
async function shareList(){
  const id=localStorage.getItem('pd-list');if(!id){say('A ligar à nuvem… tente daqui a pouco. · Connecting, try again shortly.');return}
  const url=location.origin+location.pathname+'#l='+id;
  const text='A nossa lista de compras partilhada. Abra no Chrome e instale. · Our shared shopping list.';
  try{if(navigator.share){await navigator.share({title:'Lista de Compras',text,url});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);say('Link copiado ✓ Envie-o por WhatsApp. · Link copied, send it on WhatsApp.')}
  catch(e){say(url,20000)}}
render();
</script>
<script type="module">
/* ---------- Live sync (Firebase Firestore) ----------
   One Firestore document per shared list: lists/<random id>.
   Items are stored as a map keyed by item id, so two phones editing different items never overwrite each other.
   Firestore's own offline cache queues changes made without signal and sends them when back online. */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc,updateDoc,deleteField} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD1IpABpldCYQWsV6pQJP3Tl5-5pTnheKo',authDomain:'compras-5ul6il.firebaseapp.com',projectId:'compras-5ul6il',storageBucket:'compras-5ul6il.firebasestorage.app',messagingSenderId:'754904962329',appId:'1:754904962329:web:a3c2f63eb78565661f6188'});
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=initializeFirestore(app,{})}

const newId=()=>{const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(24));return[...r].map(x=>a[x%a.length]).join('')};
const clean=i=>({id:i.id,sec:i.sec,pt:i.pt,en:i.en||'',qty:i.qty||1,price:i.price||0,note:i.note||'',done:!!i.done,t:i.t||Date.now()});
const toDoc=()=>({v:1,sections:S.sections,usual:S.usual,learn:S.learn,items:Object.fromEntries(S.items.map(i=>[i.id,clean(i)]))});

const m=location.hash.match(/[#&]l=([A-Za-z0-9]{20,})/);
let id=localStorage.getItem('pd-list'),joined=false;
if(m){joined=m[1]!==id;id=m[1];localStorage.setItem('pd-list',id)}
const ref=()=>doc(db,'lists',id);
if(!id){id=newId();localStorage.setItem('pd-list',id);setDoc(ref(),toDoc()).catch(fail)}
// keep the list code in the address bar, so copying the URL from there also shares this list
history.replaceState(null,'',location.pathname+'#l='+id);
$('shr').style.display='block';

const sy=$('sy');
function fail(e){console.warn('sync',e);sy.className='';sy.textContent='○';sy.title='Sem sincronização · Not syncing: '+(e&&e.code||e)}
R.item=i=>updateDoc(ref(),{['items.'+i.id]:clean(i)}).catch(fail);
R.del=ids=>ids.length&&updateDoc(ref(),Object.fromEntries(ids.map(x=>['items.'+x,deleteField()]))).catch(fail);
R.field=k=>updateDoc(ref(),{[k]:S[k]}).catch(fail);

let first=true,retried=false;
onSnapshot(ref(),{includeMetadataChanges:true},snap=>{
  const off=snap.metadata.fromCache;
  sy.className=off?'':'on';sy.textContent='●';sy.title=off?'Offline: alterações serão enviadas depois · changes will sync later':'Sincronizado · Synced';
  if(!snap.exists()){
    // our own list never reached the server (e.g. first upload failed): upload this phone's copy now
    if(!off&&!joined&&!snap.metadata.hasPendingWrites&&!retried){retried=true;setDoc(ref(),toDoc()).catch(fail);return}
    if(!off&&joined)say('Lista partilhada não encontrada. Peça o link outra vez. · Shared list not found.',10000);return}
  const d=snap.data();
  S={sections:d.sections||S.sections,usual:d.usual||[],learn:d.learn||{},items:Object.values(d.items||{}).sort((a,b)=>(a.t||0)-(b.t||0))};
  save();render(true);
  if(first&&joined&&!off){first=false;say('Ligado à lista partilhada ✓ · Joined the shared list')}
},fail);
</script>
